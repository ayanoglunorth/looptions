<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .p-canvas {
    position: relative; width: 440px; height: 280px; overflow: hidden;
    background:
      radial-gradient(95% 110% at 100% 0%, #F47A35 0%, rgba(244, 122, 53, 0) 66%),
      radial-gradient(90% 100% at 0% 100%, #7C66D6 0%, rgba(124, 102, 214, 0) 68%),
      linear-gradient(140deg, #3A2256 0%, #241538 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 26px; box-sizing: border-box;
  }
  .p-icon { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 36px -10px rgba(14, 6, 26, .68), 0 0 0 1.5px rgba(255, 255, 255, .2); }
  .p-icon svg { display: block; width: 100%; height: 100%; }
  h1 { margin: 0; text-align: center; font-size: 40px; font-weight: 700; line-height: 1.03; letter-spacing: -.035em; color: #FFFDFB; text-shadow: 0 4px 18px rgba(18, 8, 32, .35); }
  h1 .hl { color: #FFE29E; }
  p { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; color: rgba(255, 251, 248, .9); }
</style>
</head>
<body>
  <div class="p-canvas grain">
    <div class="p-icon">
      <svg viewBox="0 0 128 128"><defs><linearGradient id="pd-bg" x1="12%" y1="6%" x2="88%" y2="96%"><stop offset="0%" stop-color="#3E2854"/><stop offset="100%" stop-color="#1E132B"/></linearGradient><radialGradient id="pd-gl" cx="82%" cy="18%" r="58%"><stop offset="0%" stop-color="#F27A36" stop-opacity=".28"/><stop offset="100%" stop-color="#F27A36" stop-opacity="0"/></radialGradient><linearGradient id="pd-bk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9B54"/><stop offset="100%" stop-color="#E85E24"/></linearGradient><mask id="pd-cut"><rect width="128" height="128" fill="#fff"/><rect x="16" y="38" width="74" height="74" rx="22" fill="#000"/></mask></defs><rect width="128" height="128" rx="30" fill="url(#pd-bg)"/><rect width="128" height="128" rx="30" fill="url(#pd-gl)"/><rect x="44" y="22" width="62" height="62" rx="17" fill="url(#pd-bk)" mask="url(#pd-cut)"/><rect x="22" y="44" width="62" height="62" rx="17" fill="#FFFDFB"/><rect x="33" y="64" width="21" height="9.5" rx="4.75" fill="#2D2134"/><rect x="57.5" y="64" width="15.5" height="9.5" rx="4.75" fill="#F27A36"/><rect x="33" y="78" width="31" height="9.5" rx="4.75" fill="#9D8CE0"/></svg>
    </div>
    <h1>Watch more.<br><span class="hl">Learn every word.</span></h1>
    <p>Dual subtitles · Instant translation · Word quiz</p>
  </div>
</body>
</html>
