<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/pages/pages.css">
<style>
 html,body{margin:0;height:100%} body{width:1280px;height:800px;overflow:hidden;font-family:"Outfit","Segoe UI",system-ui,sans-serif;color:#2d2134}
 .bg{position:absolute;inset:0;background:radial-gradient(70% 90% at 100% 0%,#f7a466,rgba(247,164,102,0) 65%),radial-gradient(60% 80% at 0% 100%,#a594e3,rgba(165,148,227,0) 70%),#fcf9fb}
 h1{position:absolute;left:72px;top:54px;margin:0;font-size:60px;font-weight:650;letter-spacing:-.03em;line-height:1.05;max-width:1100px}
 .shell{position:absolute;overflow:hidden;background:#fcf9fb;border-radius:28px;box-shadow:0 40px 80px -30px rgba(70,35,90,.55),0 0 0 1px rgba(45,33,52,.06)}
 iframe{border:0;display:block;transform-origin:0 0}
</style></head><body>
<div class="bg grain field-peach"></div><h1 id="t"></h1><div class="shell" id="s"><iframe id="f"></iframe></div>
<script>
 const q=new URLSearchParams(location.search), w=+q.get('w'), h=+q.get('h'), sc=+(q.get('sc')||1);
 document.getElementById('t').textContent=q.get('title'); if(q.get('tw')) document.getElementById('t').style.maxWidth=q.get('tw')+'px';
 const s=document.getElementById('s'), f=document.getElementById('f');
 s.style.width=w*sc+'px'; s.style.height=h*sc+'px'; s.style.left=(q.get('x')||((1280-w*sc)/2))+'px'; s.style.top=(q.get('y')||170)+'px';
 f.style.width=w+'px'; f.style.height=h+'px'; f.style.transform='scale('+sc+')'; {const [p,hash='']=q.get('src').split('#'); f.src=p+'?set='+q.get('set')+(hash?'#'+hash:'');}
</script></body></html>
