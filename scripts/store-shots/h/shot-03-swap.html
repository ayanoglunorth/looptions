<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .s-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(56% 70% at 95% 4%, rgba(242, 122, 54, .32) 0%, rgba(242, 122, 54, 0) 64%),
      radial-gradient(55% 75% at 4% 98%, rgba(165, 148, 227, .28) 0%, rgba(165, 148, 227, 0) 68%),
      linear-gradient(155deg, #2D1D41 0%, #1B1128 58%, #130B1D 100%);
  }
  .s-head { position: absolute; left: 72px; right: 72px; top: 52px; }
  h1 { margin: 0; font-size: 52px; font-weight: 700; letter-spacing: -.03em; line-height: 1.06; color: #FFFDFB; }
  h1 .hl { color: #FF9A54; }
  .s-sub { margin: 8px 0 0; font-size: 20px; font-weight: 450; color: rgba(242, 234, 250, .78); }

  /* Authentic 16:9 widescreen framing so Tokyo's full face, sofa & blinds remain bright and recognizable */
  .s-pair {
    position: absolute; left: 64px; right: 64px; top: 230px; height: 354px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  .s-frame {
    position: relative; border-radius: 24px; overflow: hidden; background: #140406;
    box-shadow: 0 42px 84px -22px rgba(6, 2, 12, .88), 0 16px 32px -12px rgba(6, 2, 12, .65);
  }
  .s-frame img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center center;
    filter: contrast(1.04) brightness(1.04);
  }
  /* Smooth full-width bottom cinema fade hides the burned-in subtitle cleanly while keeping Tokyo's face 100% bright */
  .s-frame .s-patch {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42%; pointer-events: none;
    background: linear-gradient(to top, #120305 0%, #140406 58%, rgba(20, 4, 6, .78) 76%, rgba(20, 4, 6, 0) 100%);
  }
  .s-frame video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }

  .s-keys {
    position: absolute; left: 50%; top: 407px; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 20px;
    background: rgba(24, 15, 36, .94); border: 1.5px solid rgba(255, 154, 84, .5);
    box-shadow: 0 24px 48px -8px rgba(0, 0, 0, .82); z-index: 20;
  }
  .kbd {
    min-width: 50px; height: 50px; padding: 0 15px; border-radius: 12px;
    display: grid; place-items: center; background: #FCF9FB; color: #2D2134;
    font-size: 20px; font-weight: 700; box-shadow: 0 4px 0 #D8CCE4;
  }
  .plus { font-size: 18px; font-weight: 700; color: #FF9A54; }

  .s-labels {
    position: absolute; left: 64px; right: 64px; top: 610px;
    display: flex; justify-content: space-between;
  }
  .s-lang {
    padding: 8px 18px; border-radius: 999px;
    background: rgba(255, 255, 255, .07);
    font-size: 14.5px; font-weight: 650; letter-spacing: .06em; color: rgba(255, 255, 255, .9);
  }
  .s-lang.en { color: #F5D547; }
</style>
</head>
<body>
  <div class="s-bg grain"></div>
  <div class="s-head">
    <h1>One key, <span class="hl">one language at a time.</span></h1>
    <p class="s-sub">Keep a single subtitle line on screen and press Ctrl+M anytime to switch languages.</p>
  </div>

  <div class="s-pair">
    <div class="s-frame">
      <img src="/h/scene-tokyo-side.jpg" alt="">
      <div class="s-patch"></div>
      <video id="v1" muted></video>
    </div>
    <div class="s-frame">
      <img src="/h/scene-tokyo-side.jpg" alt="">
      <div class="s-patch"></div>
      <video id="v2" muted></video>
    </div>
  </div>

  <div class="s-keys">
    <span class="kbd">Ctrl</span>
    <span class="plus">+</span>
    <span class="kbd">M</span>
  </div>

  <div class="s-labels">
    <span class="s-lang">ES · TARGET</span>
    <span class="s-lang en">EN · NATIVE</span>
  </div>

  <script src="/__mock.js"></script>
  <script src="/src/core/parse.js"></script><script src="/src/core/lang.js"></script><script src="/src/core/i18n.js"></script>
  <script src="/src/core/words-en.js"></script><script src="/src/core/freq-en.js"></script><script src="/src/core/vocab.js"></script><script src="/src/core/ability.js"></script>
  <script src="/src/core/menu.js"></script><script src="/src/core/overlay.js"></script>
  <script>
    const cue = text => [{ start: 0, end: 10, text }];
    const mount = (el, showSecondary) => {
      Object.defineProperty(el, 'currentTime', { get: () => 5, set() {} });
      Object.defineProperty(el, 'paused', { get: () => true });
      el.play = () => Promise.resolve(); el.pause = () => {};
      const prefs = DS.mergePrefs({ primary: 'es', secondary: 'en', size: 112, lift: 10, logo: 'off', style: 'standard', font: 'roboto' });
      const ov = DS.createOverlay();
      ov.set({
        video: el,
        lines: [
          { getCues: () => cue('But when this story started,'), offset: 0, role: 'secondary', lang: 'en' },
          { getCues: () => cue('Pero cuando comenzó esta historia,'), offset: 0, role: 'primary', lang: 'es' }
        ],
        size: prefs.size, mode: 'swap', align: true, font: prefs.font, look: DS.lookVars(prefs), logo: 'off',
        prefs, sel: {}, onPrefs() {}, onSel() {}, onWord: () => Promise.resolve(''), onSave: () => Promise.resolve()
      });
      if (showSecondary) ov.toggle();
    };
    mount(document.getElementById('v1'), false);
    mount(document.getElementById('v2'), true);
    document.querySelectorAll('looptions-overlay').forEach(host => {
      host.style.setProperty('border-radius', '24px', 'important');
      host.style.setProperty('overflow', 'hidden', 'important');
    });
  </script>
</body>
</html>
