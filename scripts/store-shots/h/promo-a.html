<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .p-canvas {
    position: relative; width: 440px; height: 280px; overflow: hidden;
    background:
      radial-gradient(72% 85% at 96% 6%, rgba(242, 122, 54, .42) 0%, rgba(242, 122, 54, 0) 64%),
      radial-gradient(65% 80% at 6% 96%, rgba(165, 148, 227, .36) 0%, rgba(165, 148, 227, 0) 66%),
      linear-gradient(150deg, #321F46 0%, #1B1128 60%, #130B1D 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 18px 24px; box-sizing: border-box;
  }
  .p-brand { display: flex; align-items: center; gap: 11px; }
  .p-icon { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 24px -6px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .14); }
  .p-icon svg { display: block; width: 100%; height: 100%; }
  .p-wm { font: 700 28px/1 "Looptions DM Sans", "Outfit", sans-serif; letter-spacing: -.03em; color: #fff; }
  .p-wm span { font-weight: 400; color: rgba(255, 255, 255, .82); }
  h1 { margin: 0; text-align: center; font-size: 40px; font-weight: 700; line-height: 1.04; letter-spacing: -.035em; color: #FFFDFB; }
  h1 .hl { color: #FF9A54; }
  .p-cap {
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 18px 9px; border-radius: 10px;
    background: rgba(10, 10, 12, .82);
    box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .68);
  }
  .p-cap .l1 { font: 600 17px/1.25 "Roboto", "Segoe UI", sans-serif; color: #fff; }
  .p-cap .l2 { font: 500 14.5px/1.25 "Roboto", "Segoe UI", sans-serif; color: #F5D547; }
</style>
</head>
<body>
  <div class="p-canvas grain">
    <div class="p-brand">
      <div class="p-icon">
        <svg viewBox="0 0 128 128"><defs><linearGradient id="pa-bg" x1="12%" y1="6%" x2="88%" y2="96%"><stop offset="0%" stop-color="#3E2854"/><stop offset="100%" stop-color="#1E132B"/></linearGradient><radialGradient id="pa-gl" cx="82%" cy="18%" r="58%"><stop offset="0%" stop-color="#F27A36" stop-opacity=".28"/><stop offset="100%" stop-color="#F27A36" stop-opacity="0"/></radialGradient><linearGradient id="pa-bk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9B54"/><stop offset="100%" stop-color="#E85E24"/></linearGradient><mask id="pa-cut"><rect width="128" height="128" fill="#fff"/><rect x="16" y="38" width="74" height="74" rx="22" fill="#000"/></mask></defs><rect width="128" height="128" rx="30" fill="url(#pa-bg)"/><rect width="128" height="128" rx="30" fill="url(#pa-gl)"/><rect x="44" y="22" width="62" height="62" rx="17" fill="url(#pa-bk)" mask="url(#pa-cut)"/><rect x="22" y="44" width="62" height="62" rx="17" fill="#FFFDFB"/><rect x="33" y="64" width="21" height="9.5" rx="4.75" fill="#2D2134"/><rect x="57.5" y="64" width="15.5" height="9.5" rx="4.75" fill="#F27A36"/><rect x="33" y="78" width="31" height="9.5" rx="4.75" fill="#9D8CE0"/></svg>
      </div>
      <div class="p-wm">Loop<span>tions</span></div>
    </div>
    <h1>Dual Subtitles.<br>Watch &amp; <span class="hl">Learn.</span></h1>
    <div class="p-cap">
      <span class="l1">Me llamo Tokio.</span>
      <span class="l2">My name's Tokyo.</span>
    </div>
  </div>
</body>
</html>
