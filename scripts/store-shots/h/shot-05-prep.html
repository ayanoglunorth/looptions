<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .s-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(56% 70% at 95% 4%, rgba(242, 122, 54, .32) 0%, rgba(242, 122, 54, 0) 64%),
      radial-gradient(55% 75% at 4% 98%, rgba(165, 148, 227, .28) 0%, rgba(165, 148, 227, 0) 68%),
      linear-gradient(155deg, #2D1D41 0%, #1B1128 58%, #130B1D 100%);
  }
  .s-head { position: absolute; left: 96px; right: 96px; top: 44px; }
  h1 { margin: 0; font-size: 52px; font-weight: 700; letter-spacing: -.03em; line-height: 1.06; color: #FFFDFB; }
  h1 .hl { color: #FF9A54; }
  .s-sub { margin: 8px 0 0; font-size: 20px; font-weight: 450; color: rgba(242, 234, 250, .78); }

  .s-stage {
    position: absolute; left: 96px; top: 172px; width: 1088px; height: 588px;
    border-radius: 26px; overflow: hidden; background: #1a1126;
    box-shadow: 0 46px 92px -22px rgba(6, 2, 12, .88), 0 18px 36px -14px rgba(6, 2, 12, .68);
    display: grid; place-items: center;
  }
  .s-scene {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(1.08) contrast(1.04);
  }
  /* Light atmospheric tint so the gorgeous GTA VI sunset bridge, skyline & palms stay clearly visible */
  .s-tint {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(24, 14, 38, .48) 0%, rgba(24, 14, 38, .22) 100%);
  }

  /* Compact, authentic Looptions ALL SET summary card so the vibrant video scene breathes around it */
  .qcard {
    position: relative; z-index: 2; width: 540px; padding: 24px 28px 26px; border-radius: 28px;
    background: #FCF9FB; color: #2D2134; box-sizing: border-box;
    box-shadow: 0 34px 70px -16px rgba(14, 6, 28, .72);
    display: grid; gap: 13px;
  }
  .qtop { display: flex; align-items: center; justify-content: space-between; }
  .qkick { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #C4501A; }
  .qback { font-size: 15px; font-weight: 600; color: #776A82; }
  .qtitle { margin: -2px 0 2px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: #2D2134; }
  .qlist { display: grid; gap: 9px; }
  .qitem {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 18px; border-radius: 999px;
    background: #fff; box-shadow: 0 8px 18px -12px rgba(70, 35, 90, .35), 0 0 0 1px #ECE3EF;
  }
  .qitem b { width: 118px; flex: none; font-size: 16.5px; font-weight: 700; color: #2D2134; }
  .qitem span { flex: 1; font-size: 15.5px; font-weight: 500; color: #6B5E78; }
  .qitem .sv {
    padding: 6px 14px; border-radius: 999px; background: #EFE9FB; color: #5B4A8F;
    font-size: 14px; font-weight: 650; flex: none;
  }
  .qbtn-sec {
    margin-top: 2px; height: 46px; border-radius: 999px; display: grid; place-items: center;
    background: #EFE9FB; color: #5B4A8F; font-size: 16px; font-weight: 650;
  }
  .qbtn-pri {
    height: 48px; border-radius: 999px; display: grid; place-items: center; color: #fff;
    font-size: 16px; font-weight: 650;
    background: radial-gradient(60% 80% at 100% 0%, #f7a466 0%, rgba(247, 164, 102, 0) 60%), linear-gradient(150deg, #c4501a, #a9420f);
    box-shadow: 0 12px 24px -10px rgba(196, 80, 26, .7);
  }
</style>
</head>
<body>
  <div class="s-bg grain"></div>
  <div class="s-head">
    <h1>Know what you’ll hear <span class="hl">before pressing play.</span></h1>
    <p class="s-sub">Missed words appear in a clean prep list so you can save them and jump straight in.</p>
  </div>

  <div class="s-stage">
    <img class="s-scene" src="/h/scene-gtavi.jpg" alt="">
    <div class="s-tint"></div>
    <div class="qcard">
      <div class="qtop">
        <span class="qkick">ALL SET</span>
        <span class="qback">Back</span>
      </div>
      <h2 class="qtitle">You’ll hear these in the video</h2>
      <div class="qlist">
        <div class="qitem"><b>reluctant</b><span>reacio, poco dispuesto</span><span class="sv">Save</span></div>
        <div class="qitem"><b>stumble</b><span>tropezar</span><span class="sv">Save</span></div>
        <div class="qitem"><b>eager</b><span>ansioso, entusiasta</span><span class="sv">Save</span></div>
      </div>
      <div class="qbtn-sec">Save all</div>
      <div class="qbtn-pri">Go to the video</div>
    </div>
  </div>
</body>
</html>
