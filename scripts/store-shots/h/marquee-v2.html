<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .m-canvas {
    position: relative; width: 1400px; height: 560px; overflow: hidden;
    background:
      radial-gradient(50% 95% at 96% 12%, rgba(242, 122, 54, .34) 0%, rgba(242, 122, 54, 0) 65%),
      radial-gradient(50% 90% at 4% 96%, rgba(165, 148, 227, .30) 0%, rgba(165, 148, 227, 0) 68%),
      linear-gradient(142deg, #2E1D42 0%, #1B1128 58%, #120B1B 100%);
    display: flex; align-items: center; justify-content: space-between; padding: 0 72px; box-sizing: border-box; gap: 48px;
  }
  .m-left { width: 540px; display: flex; flex-direction: column; gap: 22px; z-index: 2; }
  .m-brand { display: flex; align-items: center; gap: 15px; }
  .m-icon-wrap { position: relative; width: 62px; height: 62px; flex: none; }
  .m-icon-wrap::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 122, 54, .34) 0%, rgba(165, 148, 227, .14) 52%, transparent 72%);
    z-index: 0;
  }
  .m-icon {
    position: relative; z-index: 1; width: 62px; height: 62px; border-radius: 15px; overflow: hidden;
    box-shadow: 0 16px 32px -8px rgba(5, 2, 12, .85), 0 6px 14px -4px rgba(5, 2, 12, .65);
  }
  .m-icon svg { display: block; width: 100%; height: 100%; }
  .m-wm { font: 700 38px/1 "Looptions DM Sans", "Outfit", sans-serif; letter-spacing: -.03em; color: #fff; }
  .m-wm span { font-weight: 400; color: rgba(255, 255, 255, .82); }
  h1 { margin: 0; font-size: 56px; font-weight: 700; line-height: 1.04; letter-spacing: -.03em; color: #FFFDFB; }
  h1 .hl { color: #FF9A54; }

  /* Clean editorial 2x2 feature list — zero pills, zero AI slop, sharp line icons */
  .m-feats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin-top: 4px;
    padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, .1);
  }
  .m-f { display: flex; align-items: center; gap: 11px; }
  .m-f .ic {
    width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: rgba(242, 122, 54, .16); color: #FF9A54;
  }
  .m-f.lil .ic { background: rgba(165, 148, 227, .16); color: #C2B4F5; }
  .m-f span { font-size: 16px; font-weight: 550; color: rgba(247, 242, 252, .9); letter-spacing: -.01em; white-space: nowrap; }

  /* Native-resolution cinemascope player frame — zero upscaling blur, zero white border */
  .m-right { position: relative; width: 676px; height: 422px; flex: none; z-index: 2; }
  .m-player {
    position: relative; width: 100%; height: 100%; border-radius: 24px; overflow: hidden;
    background: #09060d;
    box-shadow: 0 42px 84px -20px rgba(5, 2, 12, .88), 0 16px 32px -12px rgba(5, 2, 12, .65);
    display: flex; align-items: center; justify-content: center;
  }
  .m-player img {
    width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block;
    filter: contrast(1.05) saturate(1.05);
  }
  .m-scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(9, 6, 13, .78) 0%, rgba(9, 6, 13, .14) 34%, rgba(9, 6, 13, 0) 56%);
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="m-canvas grain">
    <div class="m-left">
      <div class="m-brand">
        <div class="m-icon-wrap">
          <div class="m-icon">
            <svg viewBox="0 0 128 128"><defs><linearGradient id="mv-bg" x1="12%" y1="6%" x2="88%" y2="96%"><stop offset="0%" stop-color="#3E2854"/><stop offset="100%" stop-color="#1E132B"/></linearGradient><radialGradient id="mv-gl" cx="82%" cy="18%" r="58%"><stop offset="0%" stop-color="#F27A36" stop-opacity=".28"/><stop offset="100%" stop-color="#F27A36" stop-opacity="0"/></radialGradient><linearGradient id="mv-bk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9B54"/><stop offset="100%" stop-color="#E85E24"/></linearGradient><mask id="mv-cut"><rect width="128" height="128" fill="#fff"/><rect x="16" y="38" width="74" height="74" rx="22" fill="#000"/></mask></defs><rect width="128" height="128" rx="30" fill="url(#mv-bg)"/><rect width="128" height="128" rx="30" fill="url(#mv-gl)"/><rect x="44" y="22" width="62" height="62" rx="17" fill="url(#mv-bk)" mask="url(#mv-cut)"/><rect x="22" y="44" width="62" height="62" rx="17" fill="#FFFDFB"/><rect x="33" y="64" width="21" height="9.5" rx="4.75" fill="#2D2134"/><rect x="57.5" y="64" width="15.5" height="9.5" rx="4.75" fill="#F27A36"/><rect x="33" y="78" width="31" height="9.5" rx="4.75" fill="#9D8CE0"/></svg>
          </div>
        </div>
        <div class="m-wm">Loop<span>tions</span></div>
      </div>
      <h1>Watch in two languages.<br><span class="hl">Learn every word.</span></h1>

      <div class="m-feats">
        <div class="m-f">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h16M4 15h11"/></svg></span>
          <span>Synced dual subtitles</span>
        </div>
        <div class="m-f lil">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
          <span>Click-to-translate</span>
        </div>
        <div class="m-f lil">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg></span>
          <span>Pre-video word quiz</span>
        </div>
        <div class="m-f">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
          <span>Spaced repetition</span>
        </div>
      </div>
    </div>

    <div class="m-right">
      <div class="m-player">
        <img src="/h/scene-dpw.jpg" alt="">
        <div class="m-scrim"></div>
        <video id="v" muted></video>
      </div>
    </div>
  </div>

  <script src="/__mock.js"></script>
  <script src="/src/core/parse.js"></script><script src="/src/core/lang.js"></script><script src="/src/core/i18n.js"></script>
  <script src="/src/core/words-en.js"></script><script src="/src/core/freq-en.js"></script><script src="/src/core/vocab.js"></script><script src="/src/core/ability.js"></script>
  <script src="/src/core/menu.js"></script><script src="/src/core/overlay.js"></script>
  <script>
    const v = document.getElementById('v');
    Object.defineProperty(v, 'currentTime', { get: () => 5, set() {} });
    Object.defineProperty(v, 'paused', { get: () => true });
    v.play = () => Promise.resolve(); v.pause = () => {};
    const cue = text => [{ start: 0, end: 10, text }];
    const L1 = 'No dije nunca que estuviera reacio a ayudar.';
    const L2 = 'I never said I was reluctant to help.';
    const prefs = DS.mergePrefs({ primary: 'es', secondary: 'en', size: 118, lift: 7, logo: 'off', style: 'standard', font: 'roboto' });
    window.ov = DS.createOverlay();
    ov.set({
      video: v,
      lines: [
        { getCues: () => cue(L2), offset: 0, role: 'secondary', lang: 'en' },
        { getCues: () => cue(L1), offset: 0, role: 'primary', lang: 'es' }
      ],
      size: prefs.size, mode: 'dual', align: true, font: prefs.font, look: DS.lookVars(prefs), logo: 'off',
      prefs, sel: {}, onPrefs() {}, onSel() {},
      onWord: () => Promise.resolve('reluctant, unwilling'),
      onSave: () => Promise.resolve()
    });
    const host = document.querySelector('looptions-overlay');
    if (host) {
      host.style.setProperty('border-radius', '24px', 'important');
      host.style.setProperty('overflow', 'hidden', 'important');
    }
  </script>
</body>
</html>
