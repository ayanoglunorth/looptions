<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .m-canvas {
    position: relative; width: 1400px; height: 560px; overflow: hidden;
    background:
      radial-gradient(50% 95% at 96% 12%, rgba(242, 122, 54, .34) 0%, rgba(242, 122, 54, 0) 65%),
      radial-gradient(50% 90% at 4% 96%, rgba(165, 148, 227, .30) 0%, rgba(165, 148, 227, 0) 68%),
      linear-gradient(142deg, #2E1D42 0%, #1B1128 58%, #120B1B 100%);
    display: flex; align-items: center; justify-content: space-between; padding: 0 76px; box-sizing: border-box; gap: 52px;
  }
  .m-left { width: 556px; display: flex; flex-direction: column; gap: 22px; z-index: 2; }
  .m-brand { display: flex; align-items: center; gap: 16px; }
  .m-icon { width: 64px; height: 64px; border-radius: 16px; overflow: hidden; box-shadow: 0 14px 32px -8px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .14); }
  .m-icon svg { display: block; width: 100%; height: 100%; }
  .m-wm { font: 700 40px/1 "Looptions DM Sans", "Outfit", sans-serif; letter-spacing: -.03em; color: #fff; }
  .m-wm span { font-weight: 400; color: rgba(255, 255, 255, .8); }
  h1 { margin: 0; font-size: 58px; font-weight: 700; line-height: 1.05; letter-spacing: -.03em; color: #FFFDFB; }
  h1 .hl { color: #FF9A54; }
  .m-sub { margin: 0; font-size: 21px; line-height: 1.42; color: rgba(244, 236, 252, .8); font-weight: 450; }

  .m-right { position: relative; width: 650px; height: 420px; flex: none; z-index: 2; }
  .m-player {
    position: relative; width: 100%; height: 100%; border-radius: 24px; overflow: hidden;
    box-shadow: 0 36px 72px -18px rgba(0, 0, 0, .78), 0 0 0 1px rgba(255, 255, 255, .1);
    background: #120b1b;
  }
  /* Slight scale & shift avoids bright storefront corner at top-left */
  .m-player img { width: 100%; height: 100%; object-fit: cover; object-position: center 34%; transform: scale(1.06); display: block; }
  .m-scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(12, 7, 20, .82) 0%, rgba(12, 7, 20, .18) 36%, rgba(12, 7, 20, 0) 60%);
    box-shadow: inset 0 0 48px rgba(10, 6, 18, .52);
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="m-canvas grain">
    <div class="m-left">
      <div class="m-brand">
        <div class="m-icon">
          <svg viewBox="0 0 128 128"><defs><linearGradient id="m-bg" x1="12%" y1="6%" x2="88%" y2="96%"><stop offset="0%" stop-color="#3E2854"/><stop offset="100%" stop-color="#1E132B"/></linearGradient><radialGradient id="m-gl" cx="82%" cy="18%" r="58%"><stop offset="0%" stop-color="#F27A36" stop-opacity=".28"/><stop offset="100%" stop-color="#F27A36" stop-opacity="0"/></radialGradient><linearGradient id="m-bk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9B54"/><stop offset="100%" stop-color="#E85E24"/></linearGradient><mask id="m-cut"><rect width="128" height="128" fill="#fff"/><rect x="16" y="38" width="74" height="74" rx="22" fill="#000"/></mask></defs><rect width="128" height="128" rx="30" fill="url(#m-bg)"/><rect width="128" height="128" rx="30" fill="url(#m-gl)"/><rect x="44" y="22" width="62" height="62" rx="17" fill="url(#m-bk)" mask="url(#m-cut)"/><rect x="22" y="44" width="62" height="62" rx="17" fill="#FFFDFB"/><rect x="33" y="64" width="21" height="9.5" rx="4.75" fill="#2D2134"/><rect x="57.5" y="64" width="15.5" height="9.5" rx="4.75" fill="#F27A36"/><rect x="33" y="78" width="31" height="9.5" rx="4.75" fill="#9D8CE0"/></svg>
        </div>
        <div class="m-wm">Loop<span>tions</span></div>
      </div>
      <h1>Watch in two languages.<br><span class="hl">Learn every word.</span></h1>
      <p class="m-sub">Synced dual subtitles, instant word translation, pre-video warm-ups, and spaced repetition.</p>
    </div>

    <div class="m-right">
      <div class="m-player">
        <img src="/h/scene-dpw.jpg" alt="">
        <div class="m-scrim"></div>
        <video id="v" muted></video>
      </div>
    </div>
  </div>

  <script src="/__mock.js"></script>
  <script src="/src/core/parse.js"></script><script src="/src/core/lang.js"></script><script src="/src/core/i18n.js"></script>
  <script src="/src/core/words-en.js"></script><script src="/src/core/freq-en.js"></script><script src="/src/core/vocab.js"></script><script src="/src/core/ability.js"></script>
  <script src="/src/core/menu.js"></script><script src="/src/core/overlay.js"></script>
  <script>
    const v = document.getElementById('v');
    Object.defineProperty(v, 'currentTime', { get: () => 5, set() {} });
    Object.defineProperty(v, 'paused', { get: () => true });
    v.play = () => Promise.resolve(); v.pause = () => {};
    const cue = text => [{ start: 0, end: 10, text }];
    const L1 = 'No dije nunca que estuviera reacio a ayudar.';
    const L2 = 'I never said I was reluctant to help.';
    const prefs = DS.mergePrefs({ primary: 'es', secondary: 'en', size: 118, lift: 7, logo: 'off', style: 'standard', font: 'roboto' });
    window.ov = DS.createOverlay();
    ov.set({
      video: v,
      lines: [
        { getCues: () => cue(L2), offset: 0, role: 'secondary', lang: 'en' },
        { getCues: () => cue(L1), offset: 0, role: 'primary', lang: 'es' }
      ],
      size: prefs.size, mode: 'dual', align: true, font: prefs.font, look: DS.lookVars(prefs), logo: 'off',
      prefs, sel: {}, onPrefs() {}, onSel() {},
      onWord: () => Promise.resolve('reluctant, unwilling'),
      onSave: () => Promise.resolve()
    });
    const host = document.querySelector('looptions-overlay');
    if (host) {
      host.style.setProperty('border-radius', '24px', 'important');
      host.style.setProperty('overflow', 'hidden', 'important');
    }
  </script>
</body>
</html>
