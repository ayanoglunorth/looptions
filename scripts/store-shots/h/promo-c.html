<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/pages/pages.css">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .p-canvas {
    position: relative; width: 440px; height: 280px; overflow: hidden;
    background:
      radial-gradient(70% 90% at 96% 8%, rgba(242, 122, 54, .44) 0%, rgba(242, 122, 54, 0) 64%),
      radial-gradient(66% 85% at 6% 96%, rgba(165, 148, 227, .36) 0%, rgba(165, 148, 227, 0) 68%),
      linear-gradient(150deg, #321F46 0%, #1B1128 60%, #130B1D 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 22px; box-sizing: border-box;
  }
  .p-head { display: flex; align-items: center; gap: 14px; }
  .p-icon { width: 54px; height: 54px; border-radius: 14px; overflow: hidden; flex: none; box-shadow: 0 12px 26px -6px rgba(0, 0, 0, .58), 0 0 0 1px rgba(255, 255, 255, .15); }
  .p-icon svg { display: block; width: 100%; height: 100%; }
  .p-title h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.04; letter-spacing: -.03em; color: #FFFDFB; white-space: nowrap; }
  .p-title h1 .hl { color: #FF9A54; }
  .p-title .p-sub { display: block; margin-top: 4px; font-size: 14.5px; font-weight: 500; color: rgba(240, 232, 250, .78); }

  .p-demo { display: flex; flex-direction: column; align-items: center; gap: 9px; margin-top: 2px; }
  .p-tip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 7px 6px 16px; border-radius: 999px; background: #FCF9FB; color: #2D2134;
    box-shadow: 0 16px 34px -10px rgba(0, 0, 0, .68); font-size: 17px; font-weight: 700;
  }
  .p-tip .dot { width: 6px; height: 6px; border-radius: 50%; background: #A594E3; }
  .p-tip .tr { color: #C4501A; font-weight: 650; }
  .p-tip .sv {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: radial-gradient(60% 80% at 100% 0%, #f7a466 0%, rgba(247, 164, 102, 0) 60%), linear-gradient(150deg, #c4501a, #a9420f);
  }
  .p-cap {
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 16px 8px; border-radius: 9px; background: rgba(10, 10, 12, .82);
  }
  .p-cap .l1 { font: 600 15.5px/1.25 "Roboto", "Segoe UI", sans-serif; color: #fff; }
  .p-cap .l1 mark { background: rgba(255, 255, 255, .24); color: #fff; padding: 0 4px; border-radius: 4px; }
  .p-cap .l2 { font: 500 13.5px/1.25 "Roboto", "Segoe UI", sans-serif; color: #F5D547; }
</style>
</head>
<body>
  <div class="p-canvas grain">
    <div class="p-head">
      <div class="p-icon">
        <svg viewBox="0 0 128 128"><defs><linearGradient id="pc-bg" x1="12%" y1="6%" x2="88%" y2="96%"><stop offset="0%" stop-color="#3E2854"/><stop offset="100%" stop-color="#1E132B"/></linearGradient><radialGradient id="pc-gl" cx="82%" cy="18%" r="58%"><stop offset="0%" stop-color="#F27A36" stop-opacity=".28"/><stop offset="100%" stop-color="#F27A36" stop-opacity="0"/></radialGradient><linearGradient id="pc-bk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9B54"/><stop offset="100%" stop-color="#E85E24"/></linearGradient><mask id="pc-cut"><rect width="128" height="128" fill="#fff"/><rect x="16" y="38" width="74" height="74" rx="22" fill="#000"/></mask></defs><rect width="128" height="128" rx="30" fill="url(#pc-bg)"/><rect width="128" height="128" rx="30" fill="url(#pc-gl)"/><rect x="44" y="22" width="62" height="62" rx="17" fill="url(#pc-bk)" mask="url(#pc-cut)"/><rect x="22" y="44" width="62" height="62" rx="17" fill="#FFFDFB"/><rect x="33" y="64" width="21" height="9.5" rx="4.75" fill="#2D2134"/><rect x="57.5" y="64" width="15.5" height="9.5" rx="4.75" fill="#F27A36"/><rect x="33" y="78" width="31" height="9.5" rx="4.75" fill="#9D8CE0"/></svg>
      </div>
      <div class="p-title">
        <h1>Dual <span class="hl">Subtitles</span></h1>
        <span class="p-sub">Looptions · Click any word to learn</span>
      </div>
    </div>

    <div class="p-demo">
      <div class="p-tip">
        <span>reacio</span><span class="dot"></span><span class="tr">reluctant</span>
        <span class="sv"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
      </div>
      <div class="p-cap">
        <span class="l1">No dije que estuviera <mark>reacio</mark> a ayudar.</span>
        <span class="l2">I never said I was reluctant to help.</span>
      </div>
    </div>
  </div>
</body>
</html>
