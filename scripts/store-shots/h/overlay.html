<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/pages/pages.css">
<style>
 html,body{margin:0;height:100%} body{width:1280px;height:800px;overflow:hidden;font-family:"Outfit","Segoe UI",system-ui,sans-serif;color:#2d2134}
 .bg{position:absolute;inset:0;background:radial-gradient(70% 90% at 100% 0%,#f7a466,rgba(247,164,102,0) 65%),radial-gradient(60% 80% at 0% 100%,#a594e3,rgba(165,148,227,0) 70%),#fcf9fb}
 h1{position:absolute;left:72px;top:54px;margin:0;font-size:60px;font-weight:650;letter-spacing:-.03em;line-height:1.05}
 video{position:absolute;left:110px;top:170px;width:1060px;height:596px;border-radius:26px;object-fit:cover;
  background:radial-gradient(40% 55% at 72% 30%,#ffd9a8,rgba(255,217,168,0) 70%),radial-gradient(60% 70% at 20% 80%,#6a4fb3,rgba(106,79,179,0) 70%),linear-gradient(160deg,#3b2a63 0%,#7a4a8f 45%,#e0794a 100%);
  box-shadow:0 40px 80px -30px rgba(70,35,90,.6)}
body.bare{width:1280px;height:720px} body.bare .bg,body.bare h1{display:none} body.bare video{left:0;top:0;width:1280px;height:720px;border-radius:0;box-shadow:none}
</style></head><body>
<div class="bg grain field-peach"></div><h1 id="t"></h1><video id="v" muted></video>
<script src="/__mock.js"></script>
<script src="/src/core/parse.js"></script><script src="/src/core/lang.js"></script><script src="/src/core/i18n.js"></script>
<script src="/src/core/words-en.js"></script><script src="/src/core/freq-en.js"></script><script src="/src/core/vocab.js"></script><script src="/src/core/ability.js"></script>
<script src="/src/core/menu.js"></script><script src="/src/core/overlay.js"></script>
<script>
 const q=new URLSearchParams(location.search), EN=q.get('set')==='en';
 document.getElementById('t').textContent=q.get('title'); if(q.get('bare')) document.body.classList.add('bare');
 const v=document.getElementById('v');
 Object.defineProperty(v,'currentTime',{get:()=>5,set(){}}); Object.defineProperty(v,'paused',{get:()=>true});
 v.play=()=>Promise.resolve(); v.pause=()=>{};
 const cue=text=>[{start:0,end:10,text}];
 const L1=EN?'No dije nunca que estuviera reacio a irme.':'I never said I was reluctant to leave.';
 const L2=EN?'I never said I was reluctant to leave.':'Gitmeye isteksiz olduğumu hiç söylemedim.';
 const dict=EN?{reacio:'reluctant, unwilling'}:{reluctant:'isteksiz, gönülsüz'};
 const prefs=DS.mergePrefs({primary:EN?'es':'en',secondary:EN?'en':'tr',size:120,lift:5,logo:'tr',style:'standard',font:'roboto'});
 window.ov=DS.createOverlay();
 ov.set({video:v,lines:[{getCues:()=>cue(L2),offset:0,role:'secondary',lang:EN?'en':'tr'},{getCues:()=>cue(L1),offset:0,role:'primary',lang:EN?'es':'en'}],
  size:q.get('bare')?165:prefs.size,mode:q.get('mode')==='swap'?'swap':'dual',align:true,font:prefs.font,look:DS.lookVars(prefs),logo:'tr',prefs,sel:{},onPrefs(){},onSel(){},
  onWord:w=>Promise.resolve(dict[w.toLowerCase().replace(/[^\p{L}]/gu,'')]||'…'),onSave:()=>Promise.resolve()});
if(q.get('show')==='secondary') ov.toggle();
 if(q.get('quiz')){
  const WS=EN?['reluctant','stumble','thorough','vague','eager','hesitate','nuance','bargain','reliable','gratitude']:['reluctant','stumble','thorough','vague','eager','hesitate','nuance','bargain','reliable','gratitude'];
  const TR={reluctant:'isteksiz, gönülsüz',stumble:'tökezlemek',thorough:'ayrıntılı, titiz',vague:'belirsiz',eager:'hevesli',hesitate:'tereddüt etmek',nuance:'nüans, ince fark',bargain:'pazarlık',reliable:'güvenilir',gratitude:'minnettarlık'};
  ov.showQuiz({words:WS.map(word=>({word})),translate:w=>Promise.resolve(TR[w]),onDone(){},onSave:()=>Promise.resolve()});
 }
</script></body></html>
